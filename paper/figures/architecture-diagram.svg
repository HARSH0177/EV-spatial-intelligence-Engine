<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFDFB" />
      <stop offset="100%" stop-color="#F4F8FA" />
    </linearGradient>

    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14281E" flood-opacity="0.04" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#455A64" />
    </marker>
  </defs>

  <style>
    .header-title { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #11281E; }
    .header-sub { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #486354; }
    .layer-title { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.8px; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 700; font-size: 13.5px; fill: #11241B; }
    .card-body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 400; font-size: 11.5px; fill: #3F574B; }
  </style>

  <!-- Main Background Container -->
  <rect width="1100" height="680" rx="16" fill="url(#mainBg)" stroke="#DFECE5" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" class="header-title">System Architecture &amp; Multi-Agent Pipeline</text>
    <text x="0" y="40" class="header-sub">End-to-end data flow from live spatial providers to queueing models and autonomous decision synthesis</text>
  </g>

  <!-- ==========================================
       LAYER 1: Interface & API Gateway Layer
       ========================================== -->
  <g transform="translate(40, 85)">
    <rect width="1020" height="85" rx="12" fill="#F0F7FD" stroke="#CBE2F8" stroke-width="1" filter="url(#boxShadow)" />
    <text x="20" y="22" class="layer-title" fill="#0D47A1">1. Interface &amp; API Gateway Layer</text>

    <!-- UI Card -->
    <g transform="translate(20, 32)">
      <rect width="310" height="42" rx="8" fill="#FFFFFF" stroke="#BBDEFB" stroke-width="1" />
      <text x="14" y="18" class="card-title">Leaflet.js Spatial Map UI</text>
      <text x="14" y="33" class="card-body">Unified 2-in-1 Discovery &amp; Plan SPA (/app)</text>
    </g>

    <!-- FastAPI Gateway Card -->
    <g transform="translate(355, 32)">
      <rect width="320" height="42" rx="8" fill="#FFFFFF" stroke="#BBDEFB" stroke-width="1" />
      <text x="14" y="18" class="card-title">FastAPI Async Gateway</text>
      <text x="14" y="33" class="card-body">/api/search/* &amp; /api/advisor/* REST Endpoints</text>
    </g>

    <!-- Cloud Run Runtime Card -->
    <g transform="translate(700, 32)">
      <rect width="300" height="42" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" />
      <text x="14" y="18" class="card-title" fill="#0D47A1">Google Cloud Run</text>
      <text x="14" y="33" class="card-body">Auto-scaling Serverless Container Runtime</text>
    </g>
  </g>

  <!-- Flow Connector: Layer 1 to Layer 2 -->
  <path d="M 515 170 L 515 200" stroke="#78909C" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- ==========================================
       LAYER 2: Autonomous Multi-Agent Layer
       ========================================== -->
  <g transform="translate(40, 200)">
    <rect width="1020" height="150" rx="12" fill="#E8F8F0" stroke="#BCE8CE" stroke-width="1" filter="url(#boxShadow)" />
    <text x="20" y="24" class="layer-title" fill="#1B5E20">2. Autonomous Multi-Agent Orchestration Layer</text>

    <!-- Agent 1: Orchestrator -->
    <g transform="translate(20, 38)">
      <rect width="150" height="96" rx="8" fill="#FFFFFF" stroke="#A3E2BE" stroke-width="1.2" />
      <text x="12" y="22" class="card-title" fill="#1B5E20">Orchestrator</text>
      <text x="12" y="42" class="card-body">• Task lifecycle</text>
      <text x="12" y="60" class="card-body">• Async routing</text>
      <text x="12" y="78" class="card-body">• Fallback coordinator</text>
    </g>

    <!-- Agent 2: Driver Assistant -->
    <g transform="translate(185, 38)">
      <rect width="155" height="96" rx="8" fill="#FFFFFF" stroke="#A3E2BE" stroke-width="1.2" />
      <text x="12" y="22" class="card-title" fill="#1B5E20">Driver Agent</text>
      <text x="12" y="42" class="card-body">• Spatial discovery</text>
      <text x="12" y="60" class="card-body">• Connector filter</text>
      <text x="12" y="78" class="card-body">• Distance ranking</text>
    </g>

    <!-- Agent 3: Advisor Agent -->
    <g transform="translate(355, 38)">
      <rect width="155" height="96" rx="8" fill="#FFFFFF" stroke="#A3E2BE" stroke-width="1.2" />
      <text x="12" y="22" class="card-title" fill="#1B5E20">Advisor Agent</text>
      <text x="12" y="42" class="card-body">• District extraction</text>
      <text x="12" y="60" class="card-body">• Competition matrix</text>
      <text x="12" y="78" class="card-body">• Zone synthesis</text>
    </g>

    <!-- Agent 4: Scoring Agent -->
    <g transform="translate(525, 38)">
      <rect width="155" height="96" rx="8" fill="#FFFFFF" stroke="#A3E2BE" stroke-width="1.2" />
      <text x="12" y="22" class="card-title" fill="#1B5E20">Scoring Agent</text>
      <text x="12" y="42" class="card-body">• Multi-factor utility</text>
      <text x="12" y="60" class="card-body">• Grid &amp; ROI analysis</text>
      <text x="12" y="78" class="card-body">• Viability ranking</text>
    </g>

    <!-- Agent 5: Data Agent -->
    <g transform="translate(695, 38)">
      <rect width="145" height="96" rx="8" fill="#FFFFFF" stroke="#A3E2BE" stroke-width="1.2" />
      <text x="12" y="22" class="card-title" fill="#1B5E20">Data Agent</text>
      <text x="12" y="42" class="card-body">• BigQuery client</text>
      <text x="12" y="60" class="card-body">• Port occupancy</text>
      <text x="12" y="78" class="card-body">• Session telemetry</text>
    </g>

    <!-- Agent 6: Explanation Agent -->
    <g transform="translate(855, 38)">
      <rect width="145" height="96" rx="8" fill="#FAF4FF" stroke="#DFCAFB" stroke-width="1.2" />
      <text x="12" y="22" class="card-title" fill="#5E249F">Explainer Agent</text>
      <text x="12" y="42" class="card-body">• Gemini 2.0 Flash</text>
      <text x="12" y="60" class="card-body">• Natural reasoning</text>
      <text x="12" y="78" class="card-body">• Signal attribution</text>
    </g>
  </g>

  <!-- Flow Connectors: Layer 2 to Layer 3 -->
  <path d="M 432 350 L 432 378" stroke="#78909C" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <path d="M 602 350 L 602 378" stroke="#78909C" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- ==========================================
       LAYER 3: Mathematical & Predictive Models
       ========================================== -->
  <g transform="translate(40, 380)">
    <rect width="1020" height="95" rx="12" fill="#FFF8F0" stroke="#FDE2C6" stroke-width="1" filter="url(#boxShadow)" />
    <text x="20" y="24" class="layer-title" fill="#B7410E">3. Applied Queueing &amp; Predictive Machine Learning Layer</text>

    <!-- M/M/c Erlang C -->
    <g transform="translate(20, 36)">
      <rect width="315" height="46" rx="8" fill="#FFFFFF" stroke="#FCD3A8" stroke-width="1" />
      <text x="14" y="20" class="card-title">M/M/c Erlang C Queue Model</text>
      <text x="14" y="36" class="card-body">Stochastic p50 / p90 Wait-Time Distributions</text>
    </g>

    <!-- Demand Forecaster -->
    <g transform="translate(355, 36)">
      <rect width="315" height="46" rx="8" fill="#FFFFFF" stroke="#FCD3A8" stroke-width="1" />
      <text x="14" y="20" class="card-title">DemandForecaster (GBT Regressor)</text>
      <text x="14" y="36" class="card-body">Gradient Boosted Port Utilization Predictions</text>
    </g>

    <!-- Queue Validator -->
    <g transform="translate(690, 36)">
      <rect width="310" height="46" rx="8" fill="#FFFFFF" stroke="#FCD3A8" stroke-width="1" />
      <text x="14" y="20" class="card-title">QueueModelValidator</text>
      <text x="14" y="36" class="card-body">728-Config Invariant Assertion Mesh</text>
    </g>
  </g>

  <!-- Flow Connector: Layer 3 to Layer 4 -->
  <path d="M 515 475 L 515 505" stroke="#78909C" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- ==========================================
       LAYER 4: Live Data Ingestion & Protocols
       ========================================== -->
  <g transform="translate(40, 505)">
    <rect width="1020" height="145" rx="12" fill="#F4FBF9" stroke="#CFECE4" stroke-width="1" filter="url(#boxShadow)" />
    <text x="20" y="24" class="layer-title" fill="#00695C">4. Live Data Fusion &amp; Hardware Protocol Layer</text>

    <!-- 6 Sources Cards with Explicit Individual Transforms -->
    <g transform="translate(20, 36)">

      <!-- 1. OpenChargeMap -->
      <g transform="translate(0, 0)">
        <rect width="152" height="90" rx="8" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1.2" />
        <text x="12" y="24" class="card-title" fill="#00695C" font-size="13">OpenChargeMap</text>
        <text x="12" y="44" class="card-body">• Global EV Registry</text>
        <text x="12" y="60" class="card-body">• Multi-station API</text>
        <text x="12" y="76" class="card-body">• Connector ratings</text>
      </g>

      <!-- 2. OSM / Overpass -->
      <g transform="translate(166, 0)">
        <rect width="152" height="90" rx="8" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1.2" />
        <text x="12" y="24" class="card-title" fill="#00695C" font-size="13">OSM / Overpass</text>
        <text x="12" y="44" class="card-body">• Parking facilities</text>
        <text x="12" y="60" class="card-body">• Mobility hubs</text>
        <text x="12" y="76" class="card-body">• District polygons</text>
      </g>

      <!-- 3. Google Places -->
      <g transform="translate(332, 0)">
        <rect width="152" height="90" rx="8" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1.2" />
        <text x="12" y="24" class="card-title" fill="#00695C" font-size="13">Google Places</text>
        <text x="12" y="44" class="card-body">• Commercial POIs</text>
        <text x="12" y="60" class="card-body">• Amenity density</text>
        <text x="12" y="76" class="card-body">• Spatial context</text>
      </g>

      <!-- 4. NREL AFDC -->
      <g transform="translate(498, 0)">
        <rect width="152" height="90" rx="8" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1.2" />
        <text x="12" y="24" class="card-title" fill="#00695C" font-size="13">NREL AFDC</text>
        <text x="12" y="44" class="card-body">• Federal station DB</text>
        <text x="12" y="60" class="card-body">• US-wide coverage</text>
        <text x="12" y="76" class="card-body">• Energy fallbacks</text>
      </g>

      <!-- 5. Google BigQuery -->
      <g transform="translate(664, 0)">
        <rect width="152" height="90" rx="8" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1.2" />
        <text x="12" y="24" class="card-title" fill="#00695C" font-size="13">Google BigQuery</text>
        <text x="12" y="44" class="card-body">• Session telemetry</text>
        <text x="12" y="60" class="card-body">• Port utilization</text>
        <text x="12" y="76" class="card-body">• Analytics dataset</text>
      </g>

      <!-- 6. OCPP 1.6 WebSocket -->
      <g transform="translate(830, 0)">
        <rect width="150" height="90" rx="8" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1.2" />
        <text x="12" y="24" class="card-title" fill="#00695C" font-size="13">OCPP 1.6 (WS)</text>
        <text x="12" y="44" class="card-body">• Live port states</text>
        <text x="12" y="60" class="card-body">• Hardware socket</text>
        <text x="12" y="76" class="card-body">• Real-time sync</text>
      </g>

    </g>
  </g>

</svg>
