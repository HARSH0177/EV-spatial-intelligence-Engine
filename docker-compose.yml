version: "3.9"

services:
  api:
    build: .
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - ocpp-central
    volumes:
      - .:/app
    restart: unless-stopped

  ocpp-central:
    build: .
    command: python -m realtime.ocpp_central
    ports:
      - "9000:9000"
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped

  ocpp-simulator:
    build: .
    command: python -m realtime.ocpp_simulator
    env_file: .env
    depends_on:
      - ocpp-central
    volumes:
      - .:/app
    restart: unless-stopped
