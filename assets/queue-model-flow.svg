<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFDFD" />
      <stop offset="100%" stop-color="#F5F9F6" />
    </linearGradient>
    <filter id="qShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14281E" flood-opacity="0.05" />
    </filter>
    <marker id="qArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2E523E" />
    </marker>
  </defs>

  <style>
    .q-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 18px; fill: #102B1E; }
    .q-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: 12.5px; fill: #486354; }
    .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #11281E; }
    .box-body { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 400; font-size: 11.5px; fill: #354D40; }
    .box-math { font-family: 'Courier New', monospace; font-weight: 700; font-size: 12.5px; fill: #0D47A1; }
    .box-badge { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; font-size: 11px; fill: #1B5E20; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="360" rx="16" fill="url(#qBg)" stroke="#E0ECE4" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(35, 25)">
    <text x="0" y="18" class="q-title">M/M/c Erlang C Stochastic Wait-Time Estimation</text>
    <text x="0" y="36" class="q-sub">Parameterized multi-server queue modeling with mathematically bounded p50 / p90 percentiles</text>
  </g>

  <!-- Flow Blocks -->
  <g transform="translate(35, 80)">

    <!-- Block 1: Arrival Rate -->
    <g transform="translate(0, 0)" filter="url(#qShadow)">
      <rect width="200" height="180" rx="12" fill="#EBF6FE" stroke="#B9DCF8" stroke-width="1" />
      <text x="16" y="28" class="box-title" fill="#0D47A1">1. Poisson Arrivals</text>
      <text x="16" y="52" class="box-math">Rate: &lambda; vehicles/hr</text>
      <text x="16" y="76" class="box-body">&bull; Time-of-day demand</text>
      <text x="16" y="96" class="box-body">&bull; Traffic density proxy</text>
      <text x="16" y="116" class="box-body">&bull; EV fleet adoption rate</text>
      <g transform="translate(16, 138)">
        <rect width="168" height="26" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1" />
        <text x="10" y="17" class="box-badge" fill="#0D47A1">Input Parameter &lambda;</text>
      </g>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 205 90 L 235 90" stroke="#546E7A" stroke-width="1.5" marker-end="url(#qArrow)" />

    <!-- Block 2: Multi-Port Capacity -->
    <g transform="translate(240, 0)" filter="url(#qShadow)">
      <rect width="230" height="180" rx="12" fill="#E8F8F0" stroke="#A9E4C2" stroke-width="1" />
      <text x="16" y="28" class="box-title" fill="#1B5E20">2. Multi-Server Ports</text>
      <text x="16" y="52" class="box-math">Capacity: c ports, &mu; min</text>
      <text x="16" y="76" class="box-body">&bull; Intensity: &rho; = &lambda; / (c &times; &mu;)</text>
      <text x="16" y="96" class="box-body">&bull; Stability check: &rho; &lt; 1.0</text>
      <text x="16" y="116" class="box-body">&bull; Exponential service time</text>
      <g transform="translate(16, 138)">
        <rect width="198" height="26" rx="6" fill="#FFFFFF" stroke="#81C784" stroke-width="1" />
        <text x="12" y="17" class="box-badge" fill="#1B5E20">Erlang C Delay Prob C(c,a)</text>
      </g>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 475 90 L 505 90" stroke="#546E7A" stroke-width="1.5" marker-end="url(#qArrow)" />

    <!-- Block 3: Percentile Wait Estimation -->
    <g transform="translate(510, 0)" filter="url(#qShadow)">
      <rect width="215" height="180" rx="12" fill="#FFF4E6" stroke="#FBD3A3" stroke-width="1" />
      <text x="16" y="28" class="box-title" fill="#B7410E">3. Percentile Waits</text>
      <text x="16" y="52" class="box-math">p50 &amp; p90 Distribution</text>
      <text x="16" y="76" class="box-body">&bull; Median wait: p50 (mins)</text>
      <text x="16" y="96" class="box-body">&bull; Tail wait: p90 (mins)</text>
      <text x="16" y="116" class="box-body">&bull; Conditional exponential</text>
      <g transform="translate(16, 138)">
        <rect width="183" height="26" rx="6" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1" />
        <text x="12" y="17" class="box-badge" fill="#B7410E">Output Wait Estimates</text>
      </g>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M 730 90 L 755 90" stroke="#546E7A" stroke-width="1.5" marker-end="url(#qArrow)" />

    <!-- Block 4: Invariant Verification -->
    <g transform="translate(760, 0)" filter="url(#qShadow)">
      <rect width="170" height="180" rx="12" fill="#F3E5F5" stroke="#D1C4E9" stroke-width="1" />
      <text x="14" y="28" class="box-title" fill="#4A148C">4. Invariant Mesh</text>
      <text x="14" y="52" class="box-math" font-size="11.5">p50 &le; p90 Always</text>
      <text x="14" y="76" class="box-body">&bull; 728 test meshes</text>
      <text x="14" y="96" class="box-body">&bull; Zero violations</text>
      <text x="14" y="116" class="box-body">&bull; Overload bounded</text>
      <g transform="translate(14, 138)">
        <rect width="142" height="26" rx="6" fill="#FFFFFF" stroke="#B39DDB" stroke-width="1" />
        <text x="10" y="17" class="box-badge" fill="#4A148C">&check; 100% Correct</text>
      </g>
    </g>

  </g>

  <!-- Bottom Banner Summary -->
  <g transform="translate(35, 280)">
    <rect width="930" height="50" rx="8" fill="#F0F5F2" stroke="#CCE0D4" stroke-width="1" />
    <text x="20" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#1C3829">
      Mathematical Verification: When Erlang C Delay Probability &lt; 0.5, over 50% of arrivals experience zero wait (p50 = 0), while tail queueing is captured by p90 &gt; 0.
    </text>
  </g>
</svg>
