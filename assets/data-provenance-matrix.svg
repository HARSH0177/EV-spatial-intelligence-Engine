<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFDFD" />
      <stop offset="100%" stop-color="#F4F8F6" />
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14281E" flood-opacity="0.05" />
    </filter>
  </defs>

  <style>
    .p-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 18px; fill: #102B1E; }
    .p-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: 12.5px; fill: #486354; }
    .card-h { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .card-t { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 400; font-size: 11.5px; fill: #354D40; }
    .badge-t { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 11px; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#pBg)" stroke="#E0ECE4" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(35, 25)">
    <text x="0" y="18" class="p-title">3-Tier Data Provenance &amp; Quantitative Confidence System</text>
    <text x="0" y="36" class="p-sub">Every station and planning zone carries an immutable data quality label and confidence score</text>
  </g>

  <!-- 3 Columns -->
  <g transform="translate(35, 75)">

    <!-- Column 1: Live -->
    <g transform="translate(0, 0)" filter="url(#pShadow)">
      <rect width="295" height="210" rx="12" fill="#E8F8F0" stroke="#A9E4C2" stroke-width="1.2" />
      <g transform="translate(16, 16)">
        <rect width="90" height="24" rx="12" fill="#2E7D32" />
        <text x="18" y="16" class="badge-t" fill="#FFFFFF">TIER 1: LIVE</text>
      </g>
      <text x="16" y="68" class="card-h" fill="#1B5E20">Real-Time Telemetry &amp; OCPP</text>
      <text x="16" y="92" class="card-t">&bull; Direct OCPP 1.6 WebSocket hardware</text>
      <text x="16" y="112" class="card-t">&bull; Active port occupancy &amp; power flow</text>
      <text x="16" y="132" class="card-t">&bull; Verified ground-truth port state</text>
      <g transform="translate(16, 160)">
        <rect width="263" height="32" rx="6" fill="#FFFFFF" stroke="#81C784" stroke-width="1" />
        <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#1B5E20">Confidence Score: 0.95 &ndash; 1.00</text>
      </g>
    </g>

    <!-- Column 2: Estimated -->
    <g transform="translate(315, 0)" filter="url(#pShadow)">
      <rect width="295" height="210" rx="12" fill="#EBF4FE" stroke="#B8DAFB" stroke-width="1.2" />
      <g transform="translate(16, 16)">
        <rect width="130" height="24" rx="12" fill="#0D47A1" />
        <text x="14" y="16" class="badge-t" fill="#FFFFFF">TIER 2: ESTIMATED</text>
      </g>
      <text x="16" y="68" class="card-h" fill="#0D47A1">Spatial API Fusion &amp; Queues</text>
      <text x="16" y="92" class="card-t">&bull; OpenChargeMap, Google Places, OSM</text>
      <text x="16" y="112" class="card-t">&bull; M/M/c Erlang C queueing estimates</text>
      <text x="16" y="132" class="card-t">&bull; Gradient Boosted demand forecasts</text>
      <g transform="translate(16, 160)">
        <rect width="263" height="32" rx="6" fill="#FFFFFF" stroke="#90CAF9" stroke-width="1" />
        <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#0D47A1">Confidence Score: 0.70 &ndash; 0.94</text>
      </g>
    </g>

    <!-- Column 3: Fallback -->
    <g transform="translate(630, 0)" filter="url(#pShadow)">
      <rect width="295" height="210" rx="12" fill="#FFF4E6" stroke="#FBD3A3" stroke-width="1.2" />
      <g transform="translate(16, 16)">
        <rect width="125" height="24" rx="12" fill="#E65100" />
        <text x="14" y="16" class="badge-t" fill="#FFFFFF">TIER 3: FALLBACK</text>
      </g>
      <text x="16" y="68" class="card-h" fill="#B7410E">Deterministic Heuristics</text>
      <text x="16" y="92" class="card-t">&bull; Seeded deterministic random signals</text>
      <text x="16" y="112" class="card-t">&bull; Zero unhandled rate-limit failures</text>
      <text x="16" y="132" class="card-t">&bull; Explicit fallback_reason field</text>
      <g transform="translate(16, 160)">
        <rect width="263" height="32" rx="6" fill="#FFFFFF" stroke="#FFB74D" stroke-width="1" />
        <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#B7410E">Confidence Score: 0.30 &ndash; 0.69</text>
      </g>
    </g>

  </g>
</svg>
